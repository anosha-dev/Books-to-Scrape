services:
  redis:
    image: redis

  postgresql:
    image: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery:
    build: .
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
  main:
    build: .
    command: python -m app.main
    depends_on:
      - redis
      - postgresql
      - celery

volumes:
  postgres_data:











 

  